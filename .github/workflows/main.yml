name: Wake up Streamlit Advanced

on:
  schedule:
    # On le lance toutes les 4 heures pour être sûr
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Open App in Real Browser
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            console.log('Ouverture de l\'application...');
            await page.goto('https://gestion-uaa-hvdeb3jue3waa2dfiebnns.streamlit.app', { waitUntil: 'networkidle' });
            await page.waitForTimeout(5000); // On attend 5 secondes que le JS tourne
            console.log('Page chargée avec succès !');
            await browser.close();
          })();
          "
